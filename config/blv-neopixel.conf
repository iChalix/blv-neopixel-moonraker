# Middleware BLV-NeoPixel <-> Moonraker/Klipper
#
# Nach Aenderungen:  sudo systemctl restart blv-neopixel

[moonraker]
# Websocket-Adresse von Moonraker. http:// und https:// werden automatisch
# auf ws:// bzw. wss:// umgeschrieben, /websocket wird angehaengt.
url = ws://127.0.0.1:7125/websocket
# Nur noetig, wenn Moonraker fuer localhost keine vertrauenswuerdige
# Verbindung erlaubt (force_logins / trusted_clients).
#api_key =
#api_key_file = ~/printer_data/moonraker_api.key

[serial]
# Stabilen Pfad verwenden, /dev/ttyUSB0 kann nach einem Neustart wandern:
#   ls -l /dev/serial/by-id/
# oder:  python3 -m blv_neopixel ports
port = /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
# Beide Sketch-Versionen laufen fest auf 57600 Baud
# (SerialObject.begin(57600) im Sketch).
baudrate = 57600
# DTR vor dem Oeffnen abschalten, damit ein Neustart der Middleware den
# Arduino nicht resettet (sonst laeuft jedes Mal die Startup-Animation).
avoid_reset = true
# Wartezeit nach dem Oeffnen der Schnittstelle in Sekunden.
reset_delay = 2.0
# Ausgaben des Arduino mitloggen (nur bei DEBUGLEVEL-Builds des Sketches).
log_incoming = false

[printer]
# Welche Version des Arduino-Sketches ist geflasht?
#   4.1 = Release V4.0/V4.1 (Standard) - Objektmodell, der Sketch fragt mit
#         M409 F"d99f" selbst nach (wird beantwortet, zusaetzlich laeuft
#         der Heartbeat weiter, falls die Rueckleitung fehlt)
#   3.0 = Release V3.0 - flaches M408-JSON, der Sketch hoert nur zu
# "alt" und "neu" sind als Schreibweise ebenfalls erlaubt.
# Zum Ausprobieren ohne Aenderung dieser Datei:
#   python3 -m blv_neopixel --sketch-version 3.0 selftest
sketch_version = 4.1

# Woher kommt der Druckfortschritt?
#   file   = display_status.progress (Standard, folgt M73 des Slicers)
#   sdcard = virtual_sdcard.progress (reine Dateiposition)
#   layer  = aktuelle Schicht / Gesamtschichten
progress_source = file
# Bei 100 % einen Wert > 1.0 senden, damit auch die letzte LED umschaltet.
# Der Sketch vergleicht LED-Nummer < fraction * LEDs und laesst sonst die
# letzte LED auf der Druckfarbe stehen.
# Wirkt nur bei sketch_version = 3.0 und ist dort standardmaessig an; V4.x
# rechnet den Fortschritt selbst aus Zeiten aus, dort ist das Ergebnis
# immer kleiner als 1.0. Nur eintragen, wenn es abgeschaltet werden soll:
#full_ring_at_100 = false
# Sendeintervalle in Sekunden. Der Sketch fragt nichts ab, er hoert nur zu:
# ohne regelmaessige Nachricht zeichnet er nicht neu.
interval_active = 1.0
interval_idle = 5.0
# Mindestabstand zwischen zwei Rahmen - schuetzt den 64 Byte grossen
# Empfangspuffer des Arduino vor Ueberlauf.
min_interval = 0.35
# Nach Druckende so lange den vollen Ring zeigen (Sekunden, 0 = aus).
complete_hold = 30
# Nach einem Abbruch so lange "Stopped" zeigen (Sekunden, 0 = aus).
cancel_hold = 10
# Manuelles Heizen, Homen oder laufende Makros als "busy" anzeigen.
busy_from_idle_timeout = true
# Statusbuchstaben fuer Sonderfaelle:
#   I idle / P printing / A paused / R pausing / B resuming / D busy
#   S stopped / C configuring / F flashing
offline_status = S
startup_status = C
error_status = S

# Zuordnung Klipper-Objekt -> Heater-Nummer des Sketches.
# PrinterObject 0 ist im Sketch das Heizbett, 1 das erste Hotend.
[heater 0]
object = heater_bed
name = Heizbett

[heater 1]
object = extruder
name = Hotend

# Beispiel fuer eine Kammer- oder Gehaeuseheizung auf PrinterObject 2:
#[heater 2]
#object = heater_generic chamber
#name = Kammer

# Reiner Temperatursensor ohne Heizung (zeigt nur die Ist-Temperatur):
#[heater 3]
#object = temperature_sensor raspberry_pi
#name = Pi

[logging]
level = info
